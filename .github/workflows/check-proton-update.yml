name: Check Proton update

on:
  schedule:
    # 09:37 America/Sao_Paulo (UTC-3, no DST) = 12:37 UTC (off-peak minute)
    - cron: "37 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  proton:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - id: check
        name: Check for newer Proton releases
        run: |
          # update-proton.sh --check result: 0 = up to date, 2 = update
          # available, anything else = error. Only 2 means "apply".
          updated=""
          for tool in ge cachyos; do
            set +e
            ./scripts/update-proton.sh "$tool" --check
            rc=$?
            set -e
            case $rc in
              0) echo "$tool up-to-date" >&2 ;;
              2)
                echo "bumping pinned $tool" >&2
                updated="$updated $tool"
                ;;
              *) echo "error checking $tool (exit $rc)" >&2; exit 1 ;;
            esac
          done
          if [[ -n "$updated" ]]; then
            echo "UPDATED_TOOLS=$updated" >> "$GITHUB_ENV"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the bumps
        if: steps.check.outputs.updated == 'true'
        run: |
          for tool in $UPDATED_TOOLS; do
            ./scripts/update-proton.sh "$tool" --apply
          done

      - uses: peter-evans/create-pull-request@v6
        if: steps.check.outputs.updated == 'true'
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          branch: proton-update
          commit-message: "gaming: bump pinned Proton"
          title: "gaming: bump Proton releases"
          body: |
            A new release of [GE-Proton](https://github.com/GloriousEggroll/proton-ge-custom)
            or [Proton-CachyOS](https://github.com/CachyOS/proton-cachyos) was
            detected. The `modules/proton-ge.nix` / `modules/proton-cachyos.nix`
            pins were bumped; the `eval` job in `check.yml` validates the configuration.