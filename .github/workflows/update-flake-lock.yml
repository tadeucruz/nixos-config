name: Update flake.lock

on:
  schedule:
    # 08:23 America/Sao_Paulo (UTC-3, no DST) = 11:23 UTC (off-peak minute to avoid GitHub Actions cron delays)
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "flake: update flake.lock"
          commit-msg: "flake: update flake.lock"
          # PAT so the PR is attributed to a user instead of github-actions[bot];
          # otherwise GitHub won't run the check workflows on the PR (the reason
          # the checks used to sit "waiting for approval").
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
