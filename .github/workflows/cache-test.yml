name: Cache round-trip test

on:
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GNU tar for actions/cache
        shell: bash
        run: |
          # nix-ci-builder is Alpine-based (busybox tar); actions/cache needs
          # GNU tar (--posix) for both saving and restoring. Install it so the
          # cache action's post step finds /usr/bin/tar ahead of /bin/tar.
          if tar --version 2>&1 | grep -qi busybox; then
            apk add --no-cache tar
          fi

      - name: Restore nix cache
        id: restore
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: ~/.cache/nix
          key: nix-cache

      - name: Check whether the marker survived from a previous run
        shell: bash
        run: |
          if [ -f ~/.cache/nix/ping ]; then
            echo "RESTORED=$(cat ~/.cache/nix/ping)" >> "$GITHUB_ENV"
          else
            echo "RESTORED=miss" >> "$GITHUB_ENV"
          fi
          echo "job.id=${{ github.job }}"

      - name: Show restore result
        if: env.RESTORED == 'miss'
        run: echo "Cache miss — writing marker so the save (post step) persists it"
      - name: Write marker on miss
        if: env.RESTORED == 'miss'
        shell: bash
        run: |
          mkdir -p ~/.cache/nix
          echo "hello-from-${{ github.run_id }}" > ~/.cache/nix/ping

      - name: Report
        run: |
          echo "restored-cache-key=${{ steps.restore.outputs.cache-hit }}"
          echo "marker=$RESTORED"