name: Check configurations

on:
  pull_request:

jobs:
  eval:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - name: Ensure GNU tar for actions/cache
        shell: bash
        run: |
          # nix-ci-builder is Alpine-based (busybox tar); actions/cache needs
          # GNU tar (--posix, -P) for both saving and restoring. Install it so
          # the cache action finds /usr/bin/tar ahead of /bin/tar.
          if tar --version 2>&1 | grep -qi busybox; then
            apk add --no-cache tar
          fi

      - name: Restore nix cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: ~/.cache/nix
          key: nix-cache

      - name: Check formatting and evaluate configurations
        run: make check