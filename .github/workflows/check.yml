name: Check configurations

on:
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "homebrew/**"
      - "Makefile"
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "modules/**"
      - "home/**"
      - "homebrew/**"
      - "Makefile"
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No nix-installer step: the Forgejo runner executes natively on the
      # NixOS host (`ubuntu-latest:host` label), where nix is already present.
      # Same entrypoint developers run locally (`make check`): nixfmt --check
      # plus evaluation of every NixOS and nix-darwin configuration. Keeping the
      # host list in the Makefile avoids it drifting from CI.
      - name: Check formatting and evaluate configurations
        run: make check
