name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3, sem DST) = 12:00 UTC
    - cron: "30 11 * * *"

env:
  TOKEN: ${{ secrets.ACTIONS_TOKEN_TADEU }}
  OWNER: tadeucruz
  REPO: nixos-config
  API: https://git.tadeucruz.com/api/v1
  PUSH_URL: https://forgejo:${{ secrets.ACTIONS_TOKEN_TADEU }}@git.tadeucruz.com/tadeucruz/nixos-config.git

jobs:
  update:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - id: apply
        name: Apply pending bumps
        run: |
          out="$(make update)"
          if [ -n "$out" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "Automated bump of the pinned upstream dependencies."
              echo
              echo "### Changes"
              echo
              echo "$out"
            } > pr-body.md
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate configurations
        if: steps.apply.outputs.updated == 'true'
        run: | 
          set -euo pipefail
          make check

      - name: Push bumps to main
        if: steps.apply.outputs.updated == 'true'
        run: |
          git config user.name "Tadeu Cruz"
          git config user.email "tadeucruz@gmail.com"
          git add modules/proton-ge.nix modules/proton-cachyos.nix modules/ogc-kernel.nix flake.lock
          git commit -m "chore: update dependencies" || true
          git push "$PUSH_URL" HEAD:main

