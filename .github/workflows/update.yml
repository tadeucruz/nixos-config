name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3, sem DST) = 12:00 UTC
    - cron: "0 12 * * *"

jobs:
  update:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - id: apply
        name: Apply pending bumps
        run: |
          out="$(make update)"
          if [ -n "$out" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "Automated bump of the pinned upstream dependencies."
              echo
              echo "### Changes"
              echo
              echo "$out"
            } > pr-body.md
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.apply.outputs.updated == 'true'
        env:
          TOKEN: ${{ secrets.ACTIONS_TOKEN_TADEU }}
        run: |
          set -euo pipefail
          API=https://git.tadeucruz.com/api/v1
          OWNER=tadeucruz
          REPO=nixos-config
          PUSH_URL="https://forgejo:${TOKEN}@git.tadeucruz.com/${OWNER}/${REPO}.git"

          git config user.name "forgejo-actions"
          git config user.email "forgejo@git.tadeucruz.com"
          git switch -c dependency-updates
          git add modules/proton-ge.nix modules/proton-cachyos.nix modules/ogc-kernel.nix flake.lock
          git commit -m "chore: update dependencies" || true
          git push -f "$PUSH_URL" dependency-updates

          body="$(cat pr-body.md)"
          body="${body//\\/\\\\}"
          body="${body//\"/\\\"}"
          body="${body//$'\n'/\\n}"
          payload="{\"title\":\"chore: update dependencies\",\"head\":\"dependency-updates\",\"base\":\"main\",\"body\":\"${body}\"}"

          list="$(curl -fsS -H "Authorization: token ${TOKEN}" \
            "${API}/repos/${OWNER}/${REPO}/pulls?state=open&head=${OWNER}:dependency-updates&base=main")"
          index="$(printf '%s' "$list" | grep -o '"number": *[0-9]*' | head -n 1 | grep -o '[0-9]*' || true)"
          if [ -n "$index" ]; then
            curl -fsS -X PATCH -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${API}/repos/${OWNER}/${REPO}/pulls/${index}" >/dev/null
            echo "updated PR #${index}"
          else
            curl -fsS -X POST -H "Authorization: token ${TOKEN}" -H "Content-Type: application/json" \
              -d "$payload" "${API}/repos/${OWNER}/${REPO}/pulls" >/dev/null
            echo "created PR"
          fi