name: Update dependencies

on:
  workflow_dispatch:
  schedule:
    # 09:00 America/Sao_Paulo (UTC-3, sem DST) = 12:00 UTC
    - cron: "0 12 * * *"

jobs:
  update:
    runs-on: nix
    steps:
      - uses: actions/checkout@v4

      - id: apply
        name: Apply pending bumps
        run: |
          out="$(make update)"
          if [ -n "$out" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "Automated bump of the pinned upstream dependencies."
              echo
              echo "### Changes"
              echo
              echo "$out"
            } > pr-body.md
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.apply.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ACTIONS_TOKEN_TADEU }}
          branch: dependency-updates
          commit-message: "chore: update dependencies"
          title: "chore: update dependencies"
          body-path: pr-body.md
          add-paths: |
            modules/proton-ge.nix
            modules/proton-cachyos.nix
            modules/ogc-kernel.nix
            flake.lock