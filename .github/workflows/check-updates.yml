name: Check dependency updates

on:
  schedule:
    # 07:30 America/Sao_Paulo (UTC-3, no DST) = 10:30 UTC (off-peak minute)
    - cron: "30 10 * * *"
  workflow_dispatch:

jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No nix-installer step: the Forgejo runner executes natively on the
      # NixOS host (`ubuntu-latest:host` label), where nix is already present.

      - id: apply
        name: Apply pending bumps
        run: |
          # scripts/update.sh apply exits 0 on success (applied or not) and
          # non-zero on error. The markdown summary (PR body) is printed on
          # stdout — empty when nothing was applied; human messages go to
          # stderr.
          set +e
          out="$(./scripts/update.sh apply)"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "error applying updates (exit $rc)" >&2
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "updated=true" >> "$GITHUB_OUTPUT"
            {
              echo "Automated bump of the pinned upstream dependencies."
              echo
              echo "### Changes"
              echo
              echo "$out"
              echo
              echo "### Validation"
              echo
              echo "The \`eval\` job in \`check.yml\` validates the configuration."
            } > pr-body.md
          else
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

      # Read the PR body into a step output; forgejo-create-pr takes pr-body as
      # a string (no file input).
      - id: body
        if: steps.apply.outputs.updated == 'true'
        run: |
          {
            echo "text<<EOF"
            cat pr-body.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: https://github.com/maxking/forgejo-create-pr@main
        if: steps.apply.outputs.updated == 'true'
        with:
          # PAT (not the automatic FORGEJO_TOKEN): a PR created with the
          # automatic token would not trigger check.yml (anti-recursion guard).
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          base: main
          pr-branch: dependency-updates
          commit-message: "chore: bump dependencies"
          pr-title: "chore: bump dependencies"
          pr-body: ${{ steps.body.outputs.text }}
          # Only the pin files belong in the PR; pr-body.md is a working-tree
          # scratch file and would otherwise be committed too. Space-separated
          # (the action runs `git add <add-paths>`).
          add-paths: modules/proton-ge.nix modules/proton-cachyos.nix modules/ogc-kernel.nix flake.lock
