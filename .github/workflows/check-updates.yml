name: Check dependency updates

on:
  schedule:
    # 07:30 America/Sao_Paulo (UTC-3, no DST) = 10:30 UTC (off-peak minute)
    - cron: "30 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - id: apply
        name: Apply pending bumps
        run: |
          # scripts/update.sh apply result: 0 = nothing changed, 2 = applied,
          # anything else = error. The markdown summary (PR body) is printed on
          # stdout; human messages go to stderr.
          set +e
          out="$(./scripts/update.sh apply)"
          rc=$?
          set -e
          case $rc in
            0) echo "updated=false" >> "$GITHUB_OUTPUT" ;;
            2)
              echo "updated=true" >> "$GITHUB_OUTPUT"
              {
                echo "Automated bump of the pinned upstream dependencies."
                echo
                echo "### Changes"
                echo
                echo "$out"
                echo
                echo "### Validation"
                echo
                echo "The \`eval\` job in \`check.yml\` validates the configuration."
              } > pr-body.md
              ;;
            *) echo "error applying updates (exit $rc)" >&2; exit 1 ;;
          esac

      - uses: peter-evans/create-pull-request@v6
        if: steps.apply.outputs.updated == 'true'
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
          branch: dependency-updates
          commit-message: "chore: bump dependencies"
          title: "chore: bump dependencies"
          body-path: pr-body.md