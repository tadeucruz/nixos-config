name: Cache diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: nix
    steps:
      - run: |
          echo "ACTIONS_CACHE_URL=$ACTIONS_CACHE_URL"
          echo "--- route ---"
          ip route
          echo "--- /etc/hosts ---"
          cat /etc/hosts
          echo "--- ts:5059 ---"
          curl -sS -m 6 "http://100.107.23.3:5059/_apis/artifactcache/cache?keys=diag" && echo
          echo "--- br0:5059 ---"
          curl -sS -m 6 "http://192.168.0.2:5059/_apis/artifactcache/cache?keys=diag" && echo
          echo "--- gw:5059 ---"
          gw="$(ip route | awk '/default/ {print $3; exit}')"
          echo "gw=$gw"
          curl -sS -m 6 "http://${gw}:5059/_apis/artifactcache/cache?keys=diag" && echo